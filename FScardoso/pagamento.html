<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento | FS CARDOSO POKÉMON</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-fs py-2">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <img src="img/logo.svg" alt="Logo FS Cardoso Pokémon">
      <span>FS CARDOSO<small>POKÉMON • BRASÍLIA</small></span>
    </a>
  </div>
</nav>

<section class="section-dark" style="min-height:80vh; display:flex; align-items:center;">
  <div class="container">
    <div class="payment-box" id="caixaPagamento">
      <div class="text-center">
        <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--gold)"></i>
        <p class="mt-3 text-paper-dim">Carregando confirmação...</p>
      </div>
    </div>
  </div>
</section>

<footer class="footer-fs">
  <div class="container">
    <p class="small text-center mb-0">&copy; <span class="ano-atual"></span> FS CARDOSO POKÉMON — Projeto acadêmico (1º Bimestre).</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script>
  const caixa = document.getElementById('caixaPagamento');
  const dados = JSON.parse(localStorage.getItem('fscardoso_ultimo_pedido') || 'null');

  if (!dados) {
    caixa.innerHTML = `
      <div class="text-center">
        <i class="fa-solid fa-bag-shopping fa-2x mb-3" style="color:var(--gold)"></i>
        <h3>Nenhum pedido encontrado</h3>
        <p class="text-paper-dim">Volte à loja e monte seu pedido para finalizar a compra.</p>
        <a href="produtos.html" class="btn-fs-primary mt-2 d-inline-block">Ir para a loja</a>
      </div>`;
  } else {
    const itensHtml = dados.pedido.itens.map(i => `
      <div class="d-flex justify-content-between small border-bottom border-secondary py-2">
        <span>${i.qtd}x ${i.nome}</span>
        <span class="font-mono">R$ ${(i.preco * i.qtd).toFixed(2).replace('.', ',')}</span>
      </div>`).join('');

    caixa.innerHTML = `
      <div class="text-center mb-4">
        <i class="fa-solid fa-circle-check fa-3x" style="color:var(--gold)"></i>
        <h2 class="mt-3">Pagamento aprovado!</h2>
        <p class="text-paper-dim">${dados.mensagem || 'Seu pedido foi confirmado com sucesso.'}</p>
        <span class="badge-fs px-3 py-2">Pedido Nº ${dados.pedido_id}</span>
      </div>
      <div class="mt-4">${itensHtml}</div>
      <div class="d-flex justify-content-between mt-3 pt-2 border-top border-secondary">
        <strong>Total pago</strong>
        <strong class="checkout-total">R$ ${dados.pedido.total.toFixed(2).replace('.', ',')}</strong>
      </div>
      <a href="produtos.html" class="btn-fs-outline mt-4 w-100 text-center d-block">Continuar comprando</a>
      <a href="index.html" class="btn-fs-primary mt-3 w-100 text-center d-block">Voltar ao início</a>
    `;
    localStorage.removeItem('fscardoso_ultimo_pedido');
  }
</script>
</body>
</html>
